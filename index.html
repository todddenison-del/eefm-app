<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="EEFM">
  <meta name="theme-color" content="#172033">
  <title>EEFM Mobile</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f4f1ea;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:88px}
    header{background:#172033;color:white;padding:calc(26px + env(safe-area-inset-top)) 28px 28px}
    header small{letter-spacing:.18em;text-transform:uppercase;opacity:.75}
    header h1{font-family:Georgia,serif;font-size:2.2rem;margin:.4rem 0 0}
    main{padding:16px}
    .card{background:white;border:1px solid #d8d2c7;border-radius:22px;padding:20px;margin:14px 0}
    h2,h3{font-family:Georgia,serif;margin:.2rem 0 .8rem}
    .eyebrow{font-size:.78rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#8a6b32}
    .muted{color:#6e7480}
    .pill{display:inline-block;background:#eee7da;border-radius:999px;padding:8px 12px;margin:4px 6px 4px 0}
    .action{background:#172033;color:white;border:0;border-radius:14px;padding:12px 15px;font-weight:700;margin:6px 6px 6px 0}
    .danger{background:#8c2f2f}
    .ok{background:#e8f2e4;color:#2b5b2c;border-radius:14px;padding:12px;font-weight:700}
    .warn{background:#f7efd8;color:#6f5315;border-radius:14px;padding:12px;font-weight:700}
    textarea,input{width:100%;font:inherit;padding:12px;border:1px solid #ccc5b9;border-radius:14px;background:#fbfaf7;margin:8px 0 12px}
    .day{width:100%;text-align:left;background:white;border:1px solid #d8d2c7;border-radius:18px;padding:16px;margin:8px 0;color:#172033}
    .day b{display:block;font-size:1.1rem;margin-top:3px}
    .timeline-item{padding:12px 0;border-bottom:1px solid #eee8de}
    .timeline-time{font-weight:800;color:#8a6b32;margin-bottom:4px}
    nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);border-top:1px solid #ddd6ca;display:flex;justify-content:space-around;padding:10px 4px calc(10px + env(safe-area-inset-bottom));z-index:20}
    nav button{background:none;border:0;color:#6e7480;font-size:.78rem;padding:8px 6px}
    nav button.active{color:#8a6b32;font-weight:800}
  </style>
</head>
<body>
<header><small>Private field application shell</small><h1>EEFM Mobile</h1></header>
<main id="app"><section class="card"><h2>Loading EEFM…</h2></section></main>
<nav id="tabs"></nav>
<script src="app.js"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js"));
}
</script>
</body>
</html>
